name: SPrav $0 Real-Time ATS Job Engine

on:
  schedule:
    # Runs every 2 hours on free GitHub Actions runners ($0 server cost)
    # Minute 20 avoids global :00 peak runner queue times
    - cron: '20 */2 * * *'
    # Fallback 6-hour trigger for test and schedule compatibility
    - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Maximum age of job postings in days'
        required: false
        default: '14'
      limit:
        description: 'Limit number of company boards to query (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'sprav-job-harvest'
  cancel-in-progress: true

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Deterministic ATS Harvester ($0 Cost)
        id: harvest
        env:
          MAX_AGE: ${{ github.event.inputs.max_age_days || '14' }}
          BOARD_LIMIT: ${{ github.event.inputs.limit || '' }}
        run: |
          CMD="python scripts/harvest_jobs.py --max-age-days ${MAX_AGE} --concurrency 30"
          if [ -n "$BOARD_LIMIT" ]; then
            CMD="$CMD --limit $BOARD_LIMIT"
          fi
          echo "Executing: $CMD"
          $CMD

      - name: Generate Rich GitHub Step Summary
        if: always()
        run: python scripts/generate_step_summary.py

      - name: Deploy Feed to GitHub Pages & Sovereign Data Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_feed
          publish_branch: gh-pages
          keep_files: false
          commit_message: "[skip ci] [skip vercel] [vercel skip] Live ATS Job Harvest & Edge CDN Refresh"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Mirror Feed to sovereign-job-feed Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_feed
          publish_branch: sovereign-job-feed
          keep_files: false
          commit_message: "[skip ci] [skip vercel] [vercel skip] Mirror to sovereign-job-feed"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Sync Local Fallback Data to Main Branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -d "data/shards" ]; then
            git add data/shards
          fi
          if [ -f "public/data/sprav_daily_jobs.json" ]; then
            git add public/data/sprav_daily_jobs.json
          fi
          if ! git diff-index --quiet HEAD --; then
            git commit -m "[skip ci] [skip vercel] Auto-sync local fallback jobs feed and partitioned shards [automated]"
            git push origin HEAD || echo "Local fallback push ignored or up to date"
          fi

