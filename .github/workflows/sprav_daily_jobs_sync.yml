name: SPrav Sovereign Daily Jobs Mirror

on:
  schedule:
    # Run automatically every hour at minute 15 (e.g. 01:15, 02:15, 03:15 UTC)
    # Minute 15 avoids the global :00 peak GitHub Actions runner congestion
    - cron: '15 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-direct-ats-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Sovereign Universe Mirror & Chunker
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          node scripts/sprav_daily_jobs_mirror.js

      - name: Deploy Mirror Feed to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_mirror
          publish_branch: gh-pages
          commit_message: "[skip ci] [skip vercel] [vercel skip] Automated Hourly ATS Mirror Ingestion"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
