name: SPrav Sovereign Daily Jobs Mirror

on:
  schedule:
    # Run automatically every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-direct-ats-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Daily ATS Mirror Aggregator
        run: |
          node scripts/sprav_daily_jobs_mirror.js

      - name: Deploy Mirror Feed to Job-Feed Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_mirror
          publish_branch: sovereign-job-feed
          commit_message: "[skip ci] [skip vercel] [vercel skip] Automated Daily ATS Mirror Ingestion"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
